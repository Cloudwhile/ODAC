name: build-apk

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  SDK_VERSION: "25.12.2"
  SDK_GCC: "14.3.0"

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64_cortex-a53
            target: bcm27xx
            subtarget: bcm2710
          - arch: aarch64_cortex-a72
            target: mvebu
            subtarget: cortexa72
          - arch: aarch64_cortex-a76
            target: bcm27xx
            subtarget: bcm2712
          - arch: aarch64_generic
            target: armsr
            subtarget: armv8
          - arch: arm_cortex-a15_neon-vfpv4
            target: armsr
            subtarget: armv7
          - arch: arm_cortex-a7_neon-vfpv4
            target: ipq40xx
            subtarget: generic
          - arch: arm_cortex-a9_vfpv3-d16
            target: mvebu
            subtarget: cortexa9
          - arch: mipsel_24kc
            target: ramips
            subtarget: mt7621
          - arch: mips_24kc
            target: ath79
            subtarget: generic
          - arch: x86_64
            target: x86
            subtarget: "64"
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bzip2 build-essential cpio diffstat file g++ gawk gettext git \
            libelf-dev libncurses-dev libssl-dev patch perl python3 \
            python3-setuptools rsync time unzip wget xz-utils zlib1g-dev zstd

      - name: Download and verify the SDK
        run: |
          set -euo pipefail
          base="https://downloads.openwrt.org/releases/${SDK_VERSION}/targets/${{ matrix.target }}/${{ matrix.subtarget }}"
          curl -fsSLO "${base}/sha256sums"
          # The libc suffix in the archive name is musl for most targets and
          # musl_eabi for the 32-bit ARM and mips ones, so read the name from
          # the release manifest instead of guessing it.
          archive=$(grep -oE "openwrt-sdk-${SDK_VERSION}-${{ matrix.target }}-${{ matrix.subtarget }}_gcc-[^ ]+_musl[^ ]*\.Linux-x86_64\.tar\.zst" sha256sums | head -1)
          [ -n "$archive" ] || { echo "no SDK archive listed for ${{ matrix.target }}/${{ matrix.subtarget }}"; exit 1; }
          curl -fsSLO "${base}/${archive}"
          grep -F "${archive}" sha256sums | sha256sum -c -
          tar --zstd -xf "${archive}"
          echo "SDK_DIR=${PWD}/${archive%.tar.zst}" >> "$GITHUB_ENV"
          df -h /

      - name: Prepare the SDK configuration
        run: |
          set -euo pipefail
          # A released SDK ships a target .config. Recreate the selection only
          # when it is missing, so build-sdk.sh can still verify target and
          # subtarget.
          if [ ! -f "${SDK_DIR}/.config" ]; then
            {
              echo "CONFIG_TARGET_${{ matrix.target }}=y"
              echo "CONFIG_TARGET_${{ matrix.target }}_${{ matrix.subtarget }}=y"
              echo "CONFIG_TARGET_BOARD=\"${{ matrix.target }}\""
              echo "CONFIG_TARGET_SUBTARGET=\"${{ matrix.subtarget }}\""
              echo "CONFIG_TARGET_ARCH_PACKAGES=\"${{ matrix.arch }}\""
              echo "CONFIG_USE_APK=y"
            } > "${SDK_DIR}/.config"
            make -C "${SDK_DIR}" defconfig
          fi
          grep -E '^CONFIG_(TARGET_BOARD|TARGET_SUBTARGET|TARGET_ARCH_PACKAGES)=' "${SDK_DIR}/.config"
          grep -Fqx "CONFIG_TARGET_ARCH_PACKAGES=\"${{ matrix.arch }}\"" "${SDK_DIR}/.config"

      - name: Build the packages
        run: scripts/build-sdk.sh "${SDK_DIR}" "${{ matrix.target }}" "${{ matrix.subtarget }}"

      - name: Collect the APKs
        run: |
          set -euo pipefail
          arch="${{ matrix.arch }}"
          version=$(sed -n 's/^PKG_VERSION:=//p' device-access/Makefile)
          release=$(sed -n 's/^PKG_RELEASE:=//p' device-access/Makefile)
          mkdir -p dist
          # Publish under the release convention name-version-rN-arch.apk.
          for dir in $(find "${SDK_DIR}/bin/packages" -type d -name "${arch}"); do
            find "${dir}" -type f -name '*.apk' | while read -r apk; do
              cp -v "${apk}" "dist/$(basename "${apk}" .apk)-${arch}.apk"
            done
          done
          for pkg in device-access luci-app-device-access; do
            [ -n "$(ls dist/${pkg}-${version}-r${release}-${arch}.apk 2>/dev/null)" ] || {
              echo "${pkg} ${version}-r${release} was not packaged for ${arch}"; ls -l dist; exit 1; }
          done
          [ -n "$(ls dist/libargon2-*-${arch}.apk 2>/dev/null)" ] || {
            echo "libargon2 was not packaged for ${arch}"; ls -l dist; exit 1; }
          (cd dist && sha256sum ./*.apk > SHA256SUMS)
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: odac-apk-${{ matrix.arch }}
          path: |
            dist/*.apk
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  release:
    name: attach the APKs to the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: odac-apk-*

      - name: Upload the APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          mkdir -p out
          find dist -name '*.apk' -exec cp -v {} out/ \;
          # One combined checksum file for every architecture.
          (cd out && sha256sum ./*.apk > SHA256SUMS)
          ls -l out
          gh release view "${tag}" >/dev/null 2>&1 ||
            gh release create "${tag}" --title "ODAC ${tag}" \
              --generate-notes --prerelease
          gh release upload "${tag}" out/*.apk out/SHA256SUMS --clobber
